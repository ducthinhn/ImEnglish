version: '3.8'

services:
  # ==============================================================================
  # PostgreSQL 16: Structured Relational Database
  # Stores: users, roles, friendships, p2p_sessions, reports, flyway schema
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: imenglish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imenglish_db}
      POSTGRES_USER: ${POSTGRES_USER:-imenglish_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imenglish_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imenglish_user} -d ${POSTGRES_DB:-imenglish_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imenglish-network

  # ==============================================================================
  # MongoDB 7: Document Database for AI and Unstructured Data
  # Stores: ai_conversation_history, long_term_memories, scenarios, icebreaker_cards
  # ==============================================================================
  mongodb:
    image: mongo:7.0
    container_name: imenglish-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-imenglish_mongo}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imenglish-network

  # ==============================================================================
  # Redis 7: In-memory Data Store
  # Stores: P2P matching queue, user online status, token revocation, rate-limits
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: imenglish-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secret_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imenglish-network

  # ==============================================================================
  # Coturn: STUN / TURN Server for WebRTC NAT Traversal
  # Used for direct peer-to-peer voice calls when symmetric NAT blocks direct P2P
  # ==============================================================================
  coturn:
    image: coturn/coturn:latest
    container_name: imenglish-coturn
    restart: unless-stopped
    network_mode: "host"
    environment:
      - USE_AUTH_SECRET=1
      - STATIC_AUTH_SECRET=${COTURN_SECRET:-coturn_shared_secret_key}
      - REALM=${COTURN_REALM:-imenglish.com}
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --min-port=49152
      - --max-port=65535
      - --realm=imenglish.com

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  imenglish-network:
    driver: bridge
